name: Test GACL

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 2:00 AM PST (UTC-8)

jobs:
  test:
    name: Test (${{ matrix.configuration }}-${{ matrix.platform }})
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          
      - uses: ./.github/actions/build-core
        with:
          configuration: ${{ matrix.configuration }}
          platform: ${{ matrix.platform }}

      - name: Run native tests
        shell: pwsh
        run: |
          $binDir = "${{ github.workspace }}\out\${{ matrix.configuration }}\${{ matrix.platform }}\bin"
          $resultsDir = "${{ github.workspace }}\TestResults"
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          $testBins = @(Get-ChildItem -Path $binDir `
            -Filter "*tests.exe" -Recurse
          )
          if ($testBins.Count -eq 0) {
            throw "No native test executables found under $binDir"
          }

          foreach ($test in $testBins) {
            Push-Location $test.DirectoryName
            try {
              $arguments = @(
                "--gtest_output=xml:$resultsDir\$($test.BaseName).xml"
              )
              if ($test.BaseName -eq "shader_tests") {
                $arguments = @("-warp") + $arguments
              }

              & $test.FullName @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "$($test.Name) failed with exit code $LASTEXITCODE"
              }
            }
            finally {
              Pop-Location
            }
          }

      - name: Publish test results
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: always()
        with:
          name: Test Results (${{ matrix.configuration }}-${{ matrix.platform }})
          path: TestResults/*.xml
          reporter: java-junit
